<svg id="c" xmlns="http://www.w3.org/2000/svg" width="1010" height="570" viewBox="0 0 1010 570"></svg>
<script>
const m=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott'];
const a=[0,0,74.32,0,0,0,0,13.84,286,0];
const b=[79.94,70.06,110.77,234.07,218.46,209.34,133.84,76.65,116.58,72.69];
const s=document.getElementById('c'),NS='http://www.w3.org/2000/svg';
const el=(t,at,tx)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);if(tx!=null)e.textContent=tx;s.appendChild(e);return e;};
const L=80,R=990,T=60,B=480,max=300,y=v=>B-(B-T)*v/max;
el('defs',{}).innerHTML='<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#69C97F"/><stop offset="1" stop-color="#7FD293"/></linearGradient>';

const step=(R-L)/m.length,bw=30,gap=6;
m.forEach((n,i)=>{const cx=L+step*i+step/2;
 if(a[i]>0)el('rect',{x:cx-bw-gap/2,y:y(a[i]),width:bw,height:B-y(a[i]),rx:6,fill:'#D5D8DD'});
 el('rect',{x:cx+gap/2,y:y(b[i]),width:bw,height:B-y(b[i]),rx:6,fill:'url(#g)'});
 el('text',{x:cx,y:B+28,'text-anchor':'middle','font-size':15,fill:'#4A4E55'},n);});

el('rect',{x:L+80,y:18,width:14,height:14,rx:3,fill:'#69C97F'});el('text',{x:L+102,y:30,'font-size':15,fill:'#4A4E55'},'2026');
el('text',{x:4,y:556,'font-size':14,fill:'#8A8E95'},'Investimento effettivo in euro per mese, gennaio–ottobre 2026 a confronto con lo stesso mese del 2025');
</script></body></html>
